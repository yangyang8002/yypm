<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>yypm</title>
<style>
/* ===== Material You (M3) —— Shizuku 同款主题 =====
   设计要点：surface 层级代替边框描边、primary 单色代替渐变、
   无玻璃拟态、无发光、卡片圆角 16、按钮全圆角、典型 M3 状态色。 */
:root{
--primary:#6750A4;--on-primary:#FFFFFF;
--secondary-container:#E8DEF8;--on-secondary-container:#1D192B;
--error-container:#F9DEDC;--on-error-container:#410E0B;
--surface:#FEF7FF;
--surface-container:#F3EDF7;--surface-container-high:#ECE6F0;--surface-container-highest:#E6E0E9;
--on-surface:#1D1B20;--on-surface-variant:#49454F;--outline:#79747E;--outline-variant:#CAC4D0;
--ok:#146C2E;--ok-container:#C4EED0;--warn:#7A5900;--warn-container:#FFDEA6;
--code-bg:#1C1B1F;--code-sub:#CAC4D0;
--r-card:16px;--r-btn:20px;--r-in:12px}
html[data-theme="dark"]{
--primary:#D0BCFF;--on-primary:#381E72;
--secondary-container:#4A4458;--on-secondary-container:#E8DEF8;
--error-container:#8C1D18;--on-error-container:#F9DEDC;
--surface:#141218;
--surface-container:#211F26;--surface-container-high:#2B2930;--surface-container-highest:#36343B;
--on-surface:#E6E0E9;--on-surface-variant:#CAC4D0;--outline:#938F99;--outline-variant:#49454F;
--ok:#7ADFA0;--ok-container:#1F4A2C;--warn:#F0C048;--warn-container:#4A3A00;
--code-bg:#0F0D13;--code-sub:#CAC4D0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--surface);color:var(--on-surface);
font-family:'Roboto','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
min-height:100vh;padding:20px 16px 44px;line-height:1.5;font-size:14px;
transition:background-color .2s ease,color .2s ease}
.appbar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.appbar>div:first-child{min-width:0;flex:1 1 auto}
h1{font-size:24px;font-weight:600;letter-spacing:0;color:var(--on-surface);line-height:1.25}
.sub{color:var(--on-surface-variant);font-size:12.5px;margin-top:3px}
.card{background:var(--surface-container);border-radius:var(--r-card);padding:16px;margin-bottom:12px;transition:background-color .2s ease}
.card h2{font-size:14px;font-weight:600;color:var(--on-surface);margin-bottom:10px;letter-spacing:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0}
.row .k{color:var(--on-surface-variant);display:flex;align-items:center;flex-shrink:0}
.row .v{font-family:ui-monospace,'Roboto Mono',SFMono-Regular,monospace;font-size:12.5px;
word-break:break-all;overflow-wrap:anywhere;text-align:right;max-width:62%;min-width:0;flex:0 1 auto;color:var(--on-surface)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;flex-shrink:0}
.dot.on{background:var(--ok)}
.dot.off{background:var(--outline-variant)}
.dot.warn{background:var(--warn)}
.pill{display:inline-block;padding:3px 12px;border-radius:8px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-container);color:var(--ok)}
.pill.err{background:var(--error-container);color:var(--on-error-container)}
.pill.warn{background:var(--warn-container);color:var(--warn)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.switch-row .lab{font-size:14px;color:var(--on-surface)}
.switch-row .hint{font-size:12px;color:var(--on-surface-variant);margin-top:2px}
.switch{position:relative;width:52px;height:32px;background:var(--surface-container-highest);
border:2px solid var(--outline);border-radius:16px;cursor:pointer;transition:background-color .2s,border-color .2s;flex-shrink:0}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch::after{content:'';position:absolute;top:50%;left:6px;width:16px;height:16px;background:var(--outline);
border-radius:50%;transform:translateY(-50%);transition:left .2s,width .2s,height .2s,background-color .2s}
.switch.on::after{left:26px;width:24px;height:24px;background:var(--on-primary)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 24px;
border:none;border-radius:var(--r-btn);font-family:inherit;font-size:14px;font-weight:600;
background:var(--primary);color:var(--on-primary);cursor:pointer;transition:filter .15s,background-color .2s;margin-top:10px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn:disabled{opacity:.38;pointer-events:none}
.update-strip{display:none;align-items:center;gap:12px;background:var(--secondary-container);
color:var(--on-secondary-container);border-radius:var(--r-card);padding:14px 16px;margin-bottom:12px;font-size:13.5px}
.update-strip.show{display:flex}
.update-strip .grow{flex:1}
.update-strip .vlink{color:var(--primary);font-weight:700;text-decoration:none;padding:4px 8px;border-radius:8px}
html[data-theme="dark"] .update-strip .vlink{color:var(--on-secondary-container)}
.output{background:var(--code-bg);border-radius:var(--r-in);padding:12px;
font-family:ui-monospace,'Roboto Mono',SFMono-Regular,monospace;font-size:12px;line-height:1.55;
height:190px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;color:var(--code-sub)}
.output .ok{color:#7ADFA0}.output .err{color:#F2B8B5}.output .info{color:#D0BCFF}
.overlay{position:fixed;inset:0;background:var(--surface);display:flex;align-items:center;justify-content:center;z-index:99;transition:opacity .3s}
.overlay.hide{opacity:0;pointer-events:none}
.spin{width:36px;height:36px;border:3px solid var(--surface-container-highest);border-top-color:var(--primary);border-radius:50%;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.chip{display:inline-block;font-size:11px;font-weight:500;color:var(--on-surface-variant);
border:1px solid var(--outline-variant);border-radius:8px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.theme-btn{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;padding:8px 14px;
border:1px solid var(--outline);border-radius:20px;background:transparent;color:var(--on-surface-variant);
font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:background-color .2s,color .2s}
.theme-btn:active{background:var(--surface-container-high)}
.note{font-size:12.5px;color:var(--on-surface-variant);margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<div class="overlay" id="overlay"><div class="spin"></div></div>

<div class="appbar">
  <div>
    <h1>yypm</h1>
    <div class="sub">Keybox 管理 · TEESimulator 挂载 <span class="chip" id="verChip">v-</span></div>
  </div>
  <button class="theme-btn" id="themeBtn" type="button"><span id="themeIcon">☾</span><span id="themeLabel">浅色</span></button>
</div>

<div class="update-strip" id="updateStrip">
  <span>⬆</span>
  <div class="grow">发现新版本 <b id="upVer"></b>（当前 <span id="upCur"></span>）</div>
  <a class="vlink" href="javascript:void(0)" onclick="confirmUpdate()">更新</a>
</div>

<div class="card">
  <h2>Keybox 状态</h2>
  <div class="row"><span class="k">挂载状态</span><span class="v" id="kbMount">-</span></div>
  <div class="row"><span class="k"><span id="kbDot" class="dot off"></span>文件大小</span><span class="v" id="kbSize">-</span></div>
  <div class="row"><span class="k">SHA256</span><span class="v" id="kbSha">-</span></div>
  <div class="row"><span class="k">更新时间</span><span class="v" id="kbTime">-</span></div>
  <div class="row"><span class="k">TEESimulator</span><span class="v" id="teeState">-</span></div>
</div>

<div class="card">
  <h2>自动获取</h2>
  <div class="switch-row">
    <div><div class="lab">定时自动获取 keybox</div><div class="hint">关闭后仅保留手动获取</div></div>
    <div class="switch" id="autoSwitch"></div>
  </div>
  <button class="btn ghost" id="btnUpdate"><span>⟳</span> 检查更新</button>
</div>

<div class="card">
  <h2>隐藏与伪装</h2>
  <div class="row"><span class="k"><span id="blDot" class="dot off"></span>隐藏 BL</span><span class="v" id="blState">-</span></div>
  <div class="switch-row">
    <div><div class="lab">自动隐藏 BL</div><div class="hint">伪造 bootloader 锁定状态</div></div>
    <div class="switch" id="autoBlSwitch"></div>
  </div>
  <button class="btn ghost" id="btnBl"><span>🛡</span> 手动隐藏 BL</button>
  <div class="row" style="margin-top:12px"><span class="k"><span id="dbgDot" class="dot off"></span>关闭调试</span><span class="v" id="dbgState">-</span></div>
  <div class="switch-row">
    <div><div class="lab">自动关闭调试</div><div class="hint">伪装为 release 版本</div></div>
    <div class="switch" id="autoDebugSwitch"></div>
  </div>
  <button class="btn ghost" id="btnDebug"><span>🔒</span> 手动关闭调试</button>
</div>

<div class="card">
  <h2>附属模块更新</h2>
  <div class="row"><span class="k"><span id="modDot" class="dot off"></span>待更新</span><span class="v" id="modCount">未检查</span></div>
  <div class="row"><span class="k">上次检查</span><span class="v" id="modTime">-</span></div>
  <button class="btn" id="btnCheckMods"><span>⟳</span> 检查附属模块更新</button>
  <p class="note">只检查不安装；需更新时用 KernelSU 的 Action 按钮安装</p>
</div>

<div class="card">
  <h2>操作</h2>
  <button class="btn" id="btnFetch"><span>⬇</span> 手动获取并挂载 keybox</button>
  <button class="btn ghost" id="btnMount"><span>🔗</span> 挂载到 TEESimulator</button>
</div>

<div class="card">
  <h2>日志</h2>
  <div class="output" id="output"></div>
</div>

<script>
var MODDIR='/data/adb/modules/yypm';
var THEME_KEY='yypm_theme';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  var i=document.getElementById('themeIcon'),l=document.getElementById('themeLabel');
  if(i)i.textContent=(t==='dark')?'☀':'☾';
  if(l)l.textContent=(t==='dark')?'深色':'浅色';
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
}
(function(){
  var t='light';
  try{t=localStorage.getItem(THEME_KEY)||'light';}catch(e){}
  applyTheme(t);
})();

function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  applyTheme(cur==='dark'?'light':'dark');
}
var out=document.getElementById('output');
var overlay=document.getElementById('overlay');

function log(line,cls){var d=document.createElement('div');if(cls)d.className=cls;d.textContent=line;out.appendChild(d);out.scrollTop=out.scrollHeight;}

function exec(cmd){
  if (typeof window.ksu !== 'undefined' && typeof window.ksu.exec === 'function') {
    return new Promise(function(res){
      var cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      var done=false;
      window[cb]=function(errno,stdout,stderr){if(done)return;done=true;delete window[cb];res({errno:errno,stdout:stdout||'',stderr:stderr||''});};
      try{ksu.exec('su -c '+JSON.stringify(cmd),'{}',cb);}catch(e){if(done)return;done=true;delete window[cb];res({errno:-1,stdout:'',stderr:String(e&&e.message||e)});}
      setTimeout(function(){if(!done){done=true;delete window[cb];res({errno:-2,stdout:'',stderr:'timeout'});}},20000);
    });
  }
  return import('kernelsu').then(function(m){return m.exec(cmd);}).catch(function(e){return {errno:-1,stdout:'',stderr:String(e&&e.message||e)};});
}

function parseKv(t){var m={};(t||'').split('\n').forEach(function(l){var i=l.indexOf('=');if(i>0)m[l.slice(0,i).trim()]=l.slice(i+1).trim();});return m;}

async function readVersion(){
  try{var r=await exec('sed -n "s/^version=//p" '+MODDIR+'/module.prop');var v=(r.stdout||'').trim();if(v)document.getElementById('verChip').textContent='v'+v;}catch(e){}
}

async function refresh(){
  var s;try{s=parseKv((await exec(MODDIR+'/webui.sh status')).stdout);}catch(e){return;}
  var mounted=(s.KEYBOX_MOUNTED==='1');
  document.getElementById('kbDot').className='dot '+(mounted?'on':'off');
  document.getElementById('kbMount').textContent=mounted?'已挂载':'未挂载';
  document.getElementById('kbSize').textContent=(s.KEYBOX_SIZE||'0')+' 字节';
  var sha=s.KEYBOX_SHA256||'';document.getElementById('kbSha').textContent=sha?sha.slice(0,16)+'…':'-';
  document.getElementById('kbTime').textContent=s.KEYBOX_UPDATED||'-';
  var tee=document.getElementById('teeState');
  tee.innerHTML=(s.TEESIMULATOR_INSTALLED==='1')?'<span class="pill ok">已安装</span>':'<span class="pill warn">未安装</span>';
  document.getElementById('autoSwitch').classList.toggle('on',s.AUTO_FETCH==='on');
  var blHidden=(s.BL_HIDDEN==='1');
  document.getElementById('blDot').className='dot '+(blHidden?'on':'off');
  document.getElementById('blState').textContent=blHidden?'已隐藏':'未隐藏';
  document.getElementById('autoBlSwitch').classList.toggle('on',s.AUTO_BL==='on');
  var dbgClosed=(s.DEBUG_CLOSED==='1');
  document.getElementById('dbgDot').className='dot '+(dbgClosed?'on':'off');
  document.getElementById('dbgState').textContent=dbgClosed?'已关闭':'未关闭';
  document.getElementById('autoDebugSwitch').classList.toggle('on',s.AUTO_DEBUG==='on');
  // 附属模块更新检查结果
  var need=parseInt(s.UPDATE_NEED||'0',10)||0;
  var checked=s.UPDATE_CHECKED||'未检查';
  var md=document.getElementById('modDot');
  md.className='dot '+((checked==='未检查'||checked==='-')?'off':(need>0?'warn':'on'));
  document.getElementById('modCount').textContent=(checked==='未检查')?'未检查':(need>0?('有 '+need+' 个可更新'):'全部最新');
  document.getElementById('modTime').textContent=checked==='未检查'?'-':checked;
}

async function toggleBl(){
  var on=!document.getElementById('autoBlSwitch').classList.contains('on');
  try{await exec(MODDIR+'/webui.sh auto-bl '+(on?'on':'off'));}catch(e){}
  await refresh();
  log('自动隐藏 BL 已'+(on?'开启':'关闭'),'info');
}

async function toggleDebug(){
  var on=!document.getElementById('autoDebugSwitch').classList.contains('on');
  try{await exec(MODDIR+'/webui.sh auto-debug '+(on?'on':'off'));}catch(e){}
  await refresh();
  log('自动关闭调试已'+(on?'开启':'关闭'),'info');
}

async function manualBl(){
  log('手动隐藏 BL...','info');
  try{var r=await exec(MODDIR+'/webui.sh bl');(r.stdout||'').split('\n').forEach(function(l){if(!l.trim())return;if(l.indexOf('FAIL')>=0)log(l,'err');else if(l.indexOf('OK')>=0)log(l,'ok');else log(l);});}
  catch(e){log('异常: '+e.message,'err');}
  await refresh();
}

async function manualDebug(){
  log('手动关闭调试...','info');
  try{var r=await exec(MODDIR+'/webui.sh debug');(r.stdout||'').split('\n').forEach(function(l){if(!l.trim())return;if(l.indexOf('FAIL')>=0)log(l,'err');else if(l.indexOf('OK')>=0)log(l,'ok');else log(l);});}
  catch(e){log('异常: '+e.message,'err');}
  await refresh();
}

async function checkUpdate(){
  log('检查更新...','info');
  try{var r=await exec(MODDIR+'/webui.sh update');var s=parseKv(r.stdout);
    if(s.UPDATE==='AVAILABLE'){
      document.getElementById('upVer').textContent='v'+s.REMOTE_VERSION;
      document.getElementById('upCur').textContent='v'+s.LOCAL_VERSION;
      document.getElementById('updateStrip').classList.add('show');
      log('发现新版本 v'+s.REMOTE_VERSION,'ok');
    }else if(s.UPDATE==='NONE'){
      document.getElementById('updateStrip').classList.remove('show');
      log('已是最新版本 v'+s.LOCAL_VERSION,'ok');
    }else{log('检查更新失败','err');}
  }catch(e){log('检查更新异常: '+e.message,'err');}
}

async function confirmUpdate(){
  log('下载新版本模块...','info');
  try{var r=await exec(MODDIR+'/webui.sh update');var s=parseKv(r.stdout);
    var url=s.DOWNLOAD_URL;
    if(!url){log('无下载地址或已是最新','info');return;}
    // 交给 webui.sh 下载（设备上常无 curl，模块内有 busybox wget 回退 + 重试）
    var dl=await exec(MODDIR+'/webui.sh download-self '+url);
    if((dl.stdout||'').indexOf('DOWNLOAD=OK')>=0){
      var sz=(dl.stdout.match(/SIZE=(\d+)/)||[])[1]||'';
      var src=(dl.stdout.match(/SOURCE=(\S+)/)||[])[1]||'';
      log('已下载到 /data/adb/yypm/update.zip'+(sz?'（'+sz+' 字节）':'')+'，请用 KernelSU 管理器安装','ok');
      if(src)log('下载源: '+src,'info');
    }else{
      log('下载失败','err');
      (dl.stdout||'').split('\n').forEach(function(l){if(l.trim())log(l,'err');});
    }
  }catch(e){log('异常: '+e.message,'err');}
}

async function toggleAuto(){
  var on=!document.getElementById('autoSwitch').classList.contains('on');
  try{await exec(MODDIR+'/webui.sh auto '+(on?'on':'off'));}catch(e){}
  await refresh();
  log('自动获取已'+(on?'开启':'关闭'),'info');
}

async function manualFetch(){
  var b=document.getElementById('btnFetch');b.disabled=true;b.innerHTML='<span>◌</span> 获取中...';
  log('开始手动获取 keybox...','info');
  try{var r=await exec(MODDIR+'/webui.sh fetch');(r.stdout||'').split('\n').forEach(function(l){if(!l.trim())return;if(l.indexOf('FAIL')>=0)log(l,'err');else if(l.indexOf('OK')>=0||l.indexOf('✓')>=0)log(l,'ok');else log(l);});}
  catch(e){log('异常: '+e.message,'err');}
  b.disabled=false;b.innerHTML='<span>⬇</span> 手动获取并挂载 keybox';
  await refresh();
}

async function manualMount(){
  log('挂载到 TEESimulator...','info');
  try{var r=await exec(MODDIR+'/webui.sh mount');(r.stdout||'').split('\n').forEach(function(l){if(!l.trim())return;if(l.indexOf('FAIL')>=0)log(l,'err');else log(l,'ok');});}
  catch(e){log('异常: '+e.message,'err');}
  await refresh();
}

async function modCheck(){
  log('检查附属模块更新 ...','info');
  try{
    var r=await exec(MODDIR+'/webui.sh check-packages');
    var t2=r.stdout||'';
    t2.split('\n').forEach(function(l){
      l=l.trim(); if(!l)return;
      if(l.indexOf('---STATUS-')>=0)return;
      var p=l.split('|');
      if(p.length>=6){
        var st=p[0],fn=p[1],lvc=p[3],rvc=p[4],msg=p[5];
        var cls=(st==='OK')?'ok':((st==='ERR')?'err':'info');
        log(fn+'  本地 '+lvc+'  →  云端 '+rvc+'   ['+msg+']',cls);
      }else if(l.indexOf('KEYBOX')<0){
        log(l);
      }
    });
    var sum=t2.match(/UPDATE_SUMMARY=(.*)/);
    if(sum&&sum[1])log('汇总：'+sum[1].trim(),'info');
    var need=t2.match(/UPDATE_NEED=(\d+)/);
    if(need&&parseInt(need[1],10)>0)log('检测到 '+need[1]+' 个模块可更新，请用 KernelSU 的 Action 按钮安装','info');
    else if(sum)log('附属模块均为最新','ok');
  }catch(e){log('检查异常: '+e.message,'err');}
  await refresh();
}

document.getElementById('themeBtn').onclick=toggleTheme;
document.getElementById('autoSwitch').onclick=toggleAuto;
document.getElementById('btnFetch').onclick=manualFetch;
document.getElementById('btnMount').onclick=manualMount;
document.getElementById('btnUpdate').onclick=checkUpdate;
document.getElementById('btnCheckMods').onclick=modCheck;
document.getElementById('autoBlSwitch').onclick=toggleBl;
document.getElementById('autoDebugSwitch').onclick=toggleDebug;
document.getElementById('btnBl').onclick=manualBl;
document.getElementById('btnDebug').onclick=manualDebug;

setTimeout(function(){overlay.classList.add('hide');},600);
readVersion();
refresh();
checkUpdate();
setTimeout(function(){ if(document.getElementById('modTime').textContent==='-') modCheck(); }, 1200);
</script>
</body>
</html>
